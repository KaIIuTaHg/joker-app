<body>
<div id="app"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================================
   JOKER — единая система расходов барбершопа.
   Расходы делятся на три вида, но живут в одном разделе «Расходы»:
     • Постоянные  — сумма/месяц, делится на реальное число дней текущего
       месяца по календарю (аренда, коммуналка, интернет...).
     • Переменные (расходники) — вы просто фиксируете каждую закупку
       (дата + сумма). Расход в день считается автоматически как
       (сумма закупки) / (сколько дней прошло до следующей закупки).
       Никакого ручного учёта остатков.
     • Разовые — обычный несистемный расход (ремонт, налог и т.п.).
   Слой DataStore — единая точка доступа к данным для будущих интеграций.
   ========================================================================= */

const STORAGE_KEY = 'joker_state_v3';

/* window.storage — внутри Claude.ai это готовый API. Вне Claude.ai (обычный браузер,
   установленное PWA, обёрнутый APK) такого API не существует — здесь его аналог
   на IndexedDB, чтобы данные реально сохранялись на устройстве пользователя. */
if(!window.storage){
  window.storage = (function(){
    const DB_NAME='joker_kv_store', STORE='kv';
    function openDB(){
      return new Promise((resolve,reject)=>{
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function get(key){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const req = db.transaction(STORE,'readonly').objectStore(STORE).get(key);
        req.onsuccess = () => resolve(req.result!==undefined ? {key, value:req.result, shared:false} : null);
        req.onerror = () => reject(req.error);
      });
    }
    async function set(key, value){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).put(value, key);
        tx.oncomplete = () => resolve({key, value, shared:false});
        tx.onerror = () => reject(tx.error);
      });
    }
    async function del(key){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = () => resolve({key, deleted:true, shared:false});
        tx.onerror = () => reject(tx.error);
      });
    }
    async function list(prefix){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const req = db.transaction(STORE,'readonly').objectStore(STORE).getAllKeys();
        req.onsuccess = () => resolve({keys:req.result.filter(k=>!prefix||String(k).startsWith(prefix)), prefix, shared:false});
        req.onerror = () => reject(req.error);
      });
    }
    return {get, set, delete: del, list};
  })();
}

const money = n => (Math.round(n||0)).toLocaleString('ru-RU') + ' ₽';
const pct = n => (n>0?'+':'') + (Math.round(n*10)/10) + '%';
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = iso => { const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short'}); };
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }

/* ---------------------------- default state ---------------------------- */
function defaultCategories(){
  return [
    {id:'rent', name:'Аренда и коммунальные'},
    {id:'consum', name:'Расходники'},
    {id:'cosmetics', name:'Косметика и товары'},
    {id:'marketing', name:'Маркетинг'},
    {id:'equipment', name:'Оборудование'},
    {id:'warehouse', name:'Склад товаров'},
    {id:'tax', name:'Налоги'},
    {id:'misc', name:'Прочее'}
  ];
}
function defaultState(){
  return {
    settings:{ pin:null, firstRun:true, isDemo:false, salaryPercent:50, lastBackupAt:null,
      goals:{ profit:null, revenue:null } },
    categories: defaultCategories(),
    dailyRevenue: [],        // {id,date,amount}
    fines: [],               // {id,date,amount,comment}
    fixedExpenses: [],       // {id,name,categoryId,amount,dayOfMonth,lastConfirmedPeriod}
    variableItems: [],       // {id,name,photo,categoryId,createdAt}
    variablePurchases: [],   // {id,itemId,date,amount}
    recordedExpenses: [],    // {id,date,amount,categoryId,name,comment,source,createdAt} — разовые + подтверждённые постоянные
    products: [],            // {id,name,photo,category,costPrice,salePrice,quantity,supplier,notes,dateAdded,createdAt}
    productSales: []         // {id,productId,date,quantity,salePrice,costPrice}
  };
}

/* ------------------------------ DataStore ------------------------------ */
const DataStore = {
  state: null,
  _saveTimer: null,
  async load(){
    try{
      const res = await window.storage.get(STORAGE_KEY,false);
      this.state = res && res.value ? JSON.parse(res.value) : defaultState();
    }catch(e){ this.state = defaultState(); }
    if(!this.state.categories || !this.state.categories.length) this.state.categories = defaultCategories();
    if(this.state.settings.salaryPercent===undefined) this.state.settings.salaryPercent = 50;
    if(this.state.settings.lastBackupAt===undefined) this.state.settings.lastBackupAt = null;
    if(this.state.settings.firstRun){
      seedDemo(this.state);
      this.state.settings.firstRun = false;
      this.state.settings.isDemo = true;
      this.save(true);
    }
  },
  save(immediate){
    clearTimeout(this._saveTimer);
    const doSave = async () => {
      try{ await window.storage.set(STORAGE_KEY, JSON.stringify(this.state), false); }catch(e){ console.error('save failed',e); }
    };
    if(immediate) doSave(); else this._saveTimer = setTimeout(doSave, 350);
  }
};

/* ------------------------------ demo data ------------------------------ */
function seedDemo(s){
  const days=75;
  const now=new Date();
  for(let d=days; d>=0; d--){
    const dt=new Date(now); dt.setDate(now.getDate()-d);
    const iso=dt.toISOString().slice(0,10);
    const isWeekend = [0,6].includes(dt.getDay());
    const base = isWeekend? 32000+Math.random()*10000 : 16000+Math.random()*9000;
    s.dailyRevenue.push({id:uid(), date:iso, amount:Math.round(base)});
    if(Math.random()<0.04) s.fines.push({id:uid(), date:iso, amount:Math.round(500+Math.random()*1500), comment:'Опоздание барбера'});
  }
  s.fixedExpenses = [
    {id:uid(), name:'Аренда помещения', categoryId:'rent', amount:60000, dayOfMonth:5, lastConfirmedPeriod: currentPeriodKey()},
    {id:uid(), name:'Интернет', categoryId:'rent', amount:4200, dayOfMonth:1, lastConfirmedPeriod: currentPeriodKey()},
    {id:uid(), name:'Коммунальные', categoryId:'rent', amount:8500, dayOfMonth:new Date().getDate(), lastConfirmedPeriod:'2000-01'}
  ];
  for(const f of s.fixedExpenses){
    if(f.lastConfirmedPeriod===currentPeriodKey()){
      s.recordedExpenses.push({id:uid(), createdAt:todayISO(), date:new Date(now.getFullYear(),now.getMonth(),Math.min(f.dayOfMonth,daysInMonth(now.getFullYear(),now.getMonth()))).toISOString().slice(0,10), amount:f.amount, categoryId:f.categoryId, name:f.name, comment:'Подтверждено как регулярный платёж', source:'fixed', sourceId:f.id});
    }
  }
  // variable items with purchase history at irregular intervals
  const itemDefs=[
    {name:'Кофе (зёрна)', categoryId:'consum', baseCost:1600, baseInterval:20},
    {name:'Шампунь American Crew', categoryId:'consum', baseCost:1500, baseInterval:28},
    {name:'Воск для укладки', categoryId:'cosmetics', baseCost:2100, baseInterval:35},
    {name:'Одноразовые перчатки', categoryId:'consum', baseCost:600, baseInterval:18},
    {name:'Полотенца одноразовые', categoryId:'consum', baseCost:1400, baseInterval:25}
  ];
  itemDefs.forEach(def=>{
    const item = {id:uid(), name:def.name, photo:null, categoryId:def.categoryId, createdAt:todayISO()};
    s.variableItems.push(item);
    let cursor = days;
    while(cursor>0){
      const interval = Math.max(7, Math.round(def.baseInterval*(0.8+Math.random()*0.4)));
      cursor -= interval;
      if(cursor<0) break;
      const dt=new Date(now); dt.setDate(now.getDate()-cursor);
      const iso=dt.toISOString().slice(0,10);
      const amount = Math.round(def.baseCost*(0.9+Math.random()*0.2));
      s.variablePurchases.push({id:uid(), itemId:item.id, date:iso, amount});
    }
  });
  s.recordedExpenses.push({id:uid(), createdAt:todayISO(), date:new Date(now-14*86400000).toISOString().slice(0,10), amount:5500, categoryId:'marketing', name:'Реклама в соцсетях', comment:'', source:'manual'});
  s.products = [
    {id:uid(), name:'Триммер Wahl', photo:null, category:'Инструменты', costPrice:3200, salePrice:4500, quantity:2, supplier:'ProTools', notes:'', dateAdded: new Date(now-20*86400000).toISOString().slice(0,10), createdAt:todayISO()},
    {id:uid(), name:'Масло для бороды (розница)', photo:null, category:'Косметика', costPrice:600, salePrice:1200, quantity:5, supplier:'BeardCo', notes:'', dateAdded: new Date(now-10*86400000).toISOString().slice(0,10), createdAt:todayISO()}
  ];
  const p = s.products[0];
  s.productSales.push({id:uid(), productId:p.id, date:new Date(now-3*86400000).toISOString().slice(0,10), quantity:1, salePrice:p.salePrice, costPrice:p.costPrice});
  p.quantity -= 1;
  s.settings.goals = {profit:200000, revenue:null};
}

/* ============================== Computations ============================ */
function periodRange(key, custom){
  const now=new Date();
  if(key==='today'){ const iso=todayISO(); return {from:iso,to:iso}; }
  if(key==='week'){ const d=new Date(now); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return {from:d.toISOString().slice(0,10), to:todayISO()}; }
  if(key==='month'){ const d=new Date(now.getFullYear(),now.getMonth(),1); return {from:d.toISOString().slice(0,10), to:todayISO()}; }
  if(key==='year'){ const d=new Date(now.getFullYear(),0,1); return {from:d.toISOString().slice(0,10), to:todayISO()}; }
  if(key==='custom' && custom) return custom;
  return {from:todayISO(), to:todayISO()};
}
function prevPeriod(range){
  const from=new Date(range.from), to=new Date(range.to);
  const len = Math.round((to-from)/86400000)+1;
  const pTo=new Date(from); pTo.setDate(pTo.getDate()-1);
  const pFrom=new Date(pTo); pFrom.setDate(pFrom.getDate()-len+1);
  return {from:pFrom.toISOString().slice(0,10), to:pTo.toISOString().slice(0,10)};
}
function periodShiftedByWeeks(range, weeks){
  const days = weeks*7;
  const from = new Date(range.from+'T00:00:00'); from.setDate(from.getDate()-days);
  const to = new Date(range.to+'T00:00:00'); to.setDate(to.getDate()-days);
  return {from: from.toISOString().slice(0,10), to: to.toISOString().slice(0,10)};
}
function inRange(dateStr, range){ return dateStr>=range.from && dateStr<=range.to; }
function sumAmount(arr){ return arr.reduce((a,x)=>a+(x.amount||0),0); }

function revenueIn(range){ return DataStore.state.dailyRevenue.filter(r=>inRange(r.date,range)); }
function finesIn(range){ return DataStore.state.fines.filter(f=>inRange(f.date,range)); }
function productSalesIn(range){ return DataStore.state.productSales.filter(p=>inRange(p.date,range)); }

/* --- переменные расходники: расход в день считается из интервалов между закупками --- */
function itemPurchases(itemId){ return DataStore.state.variablePurchases.filter(p=>p.itemId===itemId).sort((a,b)=>a.date.localeCompare(b.date)); }
function itemStats(item){
  const purchases = itemPurchases(item.id);
  if(purchases.length<2){
    const last = purchases[0]||null;
    const isEstimate = purchases.length===1 && item.estimateDays>0;
    const avgDailyCost = isEstimate ? last.amount/item.estimateDays : null;
    return {avgDailyCost, isEstimate, purchaseCount:purchases.length, lastPurchase:last,
      avgIntervalDays: isEstimate ? item.estimateDays : null,
      daysSinceLast: last?daysBetween(last.date, todayISO()):null, overdue:false};
  }
  let totalCost=0, totalDays=0;
  for(let i=0;i<purchases.length-1;i++){
    const d = daysBetween(purchases[i].date, purchases[i+1].date);
    if(d>0){ totalCost += purchases[i].amount; totalDays += d; }
  }
  const avgDailyCost = totalDays>0 ? totalCost/totalDays : null;
  const avgIntervalDays = totalDays/(purchases.length-1);
  const last = purchases[purchases.length-1];
  const daysSinceLast = daysBetween(last.date, todayISO());
  const overdue = avgIntervalDays>0 && daysSinceLast > avgIntervalDays*1.15;
  return {avgDailyCost, isEstimate:false, purchaseCount:purchases.length, lastPurchase:last, avgIntervalDays, daysSinceLast, overdue};
}
function variableDailyTotal(){
  return DataStore.state.variableItems.reduce((sum,item)=>{ const st=itemStats(item); return sum+(st.avgDailyCost||0); },0);
}
/* --- единый календарь предстоящих расходов: постоянные (по дню месяца) + прогноз окончания расходников --- */
function upcomingExpenseEvents(horizonDays=30){
  const s = DataStore.state;
  const now = new Date(); now.setHours(0,0,0,0);
  const events = [];

  s.fixedExpenses.forEach(f=>{
    const dim = daysInMonth(now.getFullYear(), now.getMonth());
    let due = new Date(now.getFullYear(), now.getMonth(), Math.min(f.dayOfMonth, dim));
    if(f.lastConfirmedPeriod===currentPeriodKey()){
      const nm = new Date(now.getFullYear(), now.getMonth()+1, 1);
      const dimNext = daysInMonth(nm.getFullYear(), nm.getMonth());
      due = new Date(nm.getFullYear(), nm.getMonth(), Math.min(f.dayOfMonth, dimNext));
    }
    due.setHours(0,0,0,0);
    const diffDays = Math.round((due-now)/86400000);
    events.push({type:'fixed', icon:'🏠', id:f.id, name:f.name, amount:f.amount, dateISO:due.toISOString().slice(0,10), diffDays, overdue:diffDays<0});
  });

  s.variableItems.forEach(item=>{
    const st = itemStats(item);
    if(!st.avgIntervalDays || !st.lastPurchase) return;
    const predicted = new Date(st.lastPurchase.date+'T00:00:00');
    predicted.setDate(predicted.getDate()+Math.round(st.avgIntervalDays));
    predicted.setHours(0,0,0,0);
    const diffDays = Math.round((predicted-now)/86400000);
    events.push({type:'variable', icon:'☕️', name:item.name, amount:st.lastPurchase.amount, dateISO:predicted.toISOString().slice(0,10), diffDays, overdue:diffDays<0, isEstimate:st.isEstimate, itemId:item.id});
  });

  return events.filter(e=>e.overdue || e.diffDays<=horizonDays).sort((a,b)=>a.diffDays-b.diffDays);
}
function upcomingEventLabel(e){
  if(e.overdue){
    return e.type==='fixed' ? `⚠️ Просрочено на ${Math.abs(e.diffDays)} дн.` : `Возможно, уже закончилось (~${Math.abs(e.diffDays)} дн. назад)`;
  }
  if(e.diffDays===0) return 'Сегодня';
  if(e.diffDays===1) return 'Завтра';
  return `Через ${e.diffDays} дн. · ${fmtDate(e.dateISO)}`;
}
function fixedDailyTotal(){
  const now = new Date();
  return sumAmount(DataStore.state.fixedExpenses)/daysInMonth(now.getFullYear(), now.getMonth());
}
function breakEvenToday(){
  const s = DataStore.state;
  const fixed = fixedDailyTotal();
  const variable = variableDailyTotal();
  const daily = fixed+variable;
  const salaryPct = s.settings.salaryPercent/100;
  const requiredRevenue = salaryPct<1 ? daily/(1-salaryPct) : null;
  return {fixed, variable, daily, requiredRevenue};
}

function finSummary(range){
  const s = DataStore.state;
  const revRecords = revenueIn(range);
  const revenue = sumAmount(revRecords);
  const fines = sumAmount(finesIn(range));
  const pSales = productSalesIn(range);
  const productRevenue = pSales.reduce((a,x)=>a+x.quantity*x.salePrice,0);
  const productCost = pSales.reduce((a,x)=>a+x.quantity*x.costPrice,0);
  const totalIncome = revenue + fines + productRevenue;
  const salaryAuto = revRecords.reduce((a,x)=>a+x.amount*(s.settings.salaryPercent/100),0);
  const recordedExp = sumAmount(s.recordedExpenses.filter(e=>inRange(e.date,range)));
  const variableExp = sumAmount(s.variablePurchases.filter(p=>inRange(p.date,range)));
  const totalExpenses = recordedExp + variableExp + salaryAuto + productCost;
  const profit = totalIncome - totalExpenses;
  const margin = totalIncome>0 ? profit/totalIncome*100 : 0;
  return {revenue, fines, productRevenue, productCost, totalIncome, salaryAuto, recordedExp, variableExp, totalExpenses, profit, margin};
}
function pctChange(cur, prev){
  if(prev===0) return cur===0? 0 : null;
  return (cur-prev)/Math.abs(prev)*100;
}
function expenseByCategory(range){
  const s = DataStore.state;
  const map = {};
  s.recordedExpenses.filter(e=>inRange(e.date,range)).forEach(e=>{ map[e.categoryId]=(map[e.categoryId]||0)+e.amount; });
  s.variablePurchases.filter(p=>inRange(p.date,range)).forEach(p=>{
    const item = s.variableItems.find(i=>i.id===p.itemId);
    if(item) map[item.categoryId] = (map[item.categoryId]||0)+p.amount;
  });
  return s.categories.map(c=>({id:c.id, name:c.name, amount: map[c.id]||0})).sort((a,b)=>b.amount-a.amount);
}

function forecastMonth(){
  const now=new Date();
  const from=new Date(now.getFullYear(),now.getMonth(),1);
  const range={from:from.toISOString().slice(0,10), to:todayISO()};
  const elapsed = Math.round((now-from)/86400000)+1;
  const total = daysInMonth(now.getFullYear(),now.getMonth());
  const sum = finSummary(range);
  if(elapsed<3) return null;
  const factor = total/elapsed;
  return {
    projIncome: Math.round(sum.totalIncome*factor),
    projExpenses: Math.round(sum.totalExpenses*factor),
    projProfit: Math.round(sum.profit*factor),
    elapsed, total
  };
}

function currentPeriodKey(){ return todayISO().slice(0,7); }
function pendingFixedConfirmations(){
  const s = DataStore.state;
  const curPeriod = currentPeriodKey();
  const now = new Date();
  const todayDay = now.getDate();
  return s.fixedExpenses.filter(t => {
    if(t.lastConfirmedPeriod===curPeriod) return false;
    const dueDay = Math.min(t.dayOfMonth, daysInMonth(now.getFullYear(), now.getMonth()));
    return todayDay >= dueDay - 2;
  });
}
function confirmFixed(id){
  const s = DataStore.state;
  const t = s.fixedExpenses.find(x=>x.id===id);
  if(!t) return;
  const now = new Date();
  const dueDay = Math.min(t.dayOfMonth, daysInMonth(now.getFullYear(), now.getMonth()));
  const date = new Date(now.getFullYear(), now.getMonth(), dueDay).toISOString().slice(0,10);
  s.recordedExpenses.push({id:uid(), createdAt:todayISO(), date, amount:t.amount, categoryId:t.categoryId, name:t.name, comment:'Подтверждено как регулярный платёж', source:'fixed', sourceId:t.id});
  DataStore.save(true); toast('Расход добавлен'); render();
}
function skipFixedThisMonth(id){
  const t = DataStore.state.fixedExpenses.find(x=>x.id===id);
  if(t) t.lastConfirmedPeriod = currentPeriodKey();
  DataStore.save(true); toast('Пропущено в этом месяце'); render();
}

function generateInsights(range){
  const insights=[];
  const cur = finSummary(range);
  const prev = finSummary(prevPeriod(range));
  const revCh = pctChange(cur.revenue, prev.revenue);
  if(revCh!==null && Math.abs(revCh)>=2) insights.push({ico: revCh>0?'📈':'📉', txt:`Выручка ${revCh>0?'выросла':'снизилась'} на ${Math.abs(Math.round(revCh))}% по сравнению с прошлым периодом.`});

  const monthAgo = finSummary(periodShiftedByWeeks(range,4));
  const revChAligned = pctChange(cur.revenue, monthAgo.revenue);
  if(revChAligned!==null && Math.abs(revChAligned)>=2) insights.push({ico:'📅', txt:`По сравнению с тем же днём недели месяц назад выручка ${revChAligned>0?'выше':'ниже'} на ${Math.abs(Math.round(revChAligned))}% — точнее отражает сезонность.`});

  const curCats = expenseByCategory(range), prevCats = expenseByCategory(prevPeriod(range));
  curCats.forEach(c=>{
    const p = prevCats.find(x=>x.id===c.id);
    if(p && p.amount>0 && c.amount>0){
      const ch = pctChange(c.amount,p.amount);
      if(ch!==null && ch>=15) insights.push({ico:'⚠️', txt:`Расходы на «${c.name}» выросли на ${Math.round(ch)}%.`});
    }
  });

  const be = breakEvenToday();
  if(be.daily>0) insights.push({ico:'📐', txt:`Ежедневная стоимость бизнеса ≈${money(be.daily)}: постоянные ${money(be.fixed)} + переменные ${money(be.variable)}.`});

  const todaySum = finSummary({from:todayISO(),to:todayISO()});
  if(be.requiredRevenue){
    if(todaySum.revenue>=be.requiredRevenue) insights.push({ico:'✅', txt:`Сегодня выручка уже покрыла точку безубыточности (${money(be.requiredRevenue)}).`});
    else insights.push({ico:'🔻', txt:`До точки безубыточности сегодня не хватает ${money(be.requiredRevenue-todaySum.revenue)}.`});
  }

  const items = DataStore.state.variableItems.map(i=>({i,st:itemStats(i)})).filter(x=>x.st.avgDailyCost);
  if(items.length){
    const top = items.sort((a,b)=>b.st.avgDailyCost-a.st.avgDailyCost)[0];
    insights.push({ico:'💡', txt:`Больше всего в день уходит на «${top.i.name}» — ~${money(top.st.avgDailyCost)}/день. Стоит поискать поставщика подешевле или закупать реже, но крупнее.`});
  }
  items.forEach(({i,st})=>{
    if(st.overdue) insights.push({ico:'🟠', txt:`«${i.name}» обычно покупаете раз в ~${Math.round(st.avgIntervalDays)} дн., прошло уже ${st.daysSinceLast} — возможно, заканчивается.`});
  });

  const fc = forecastMonth();
  if(fc) insights.push({ico:'🔮', txt:`При текущей динамике прогнозируемая прибыль за месяц: ${money(fc.projProfit)} (это прогноз, не гарантия).`});

  if(insights.length===0) insights.push({ico:'ℹ️', txt:'Недостаточно данных для выводов за этот период.'});
  return insights;
}
function generateAlerts(){
  const alerts=[];
  const lastBackup = DataStore.state.settings.lastBackupAt;
  const daysSinceBackup = lastBackup ? daysBetween(lastBackup, todayISO()) : null;
  if(daysSinceBackup===null || daysSinceBackup>=14){
    alerts.push({level: (daysSinceBackup===null || daysSinceBackup>=30) ? 'red' : 'amber',
      txt: (daysSinceBackup===null ? 'Резервная копия данных ещё ни разу не сохранялась' : `Резервная копия не обновлялась ${daysSinceBackup} дн.`) + ' — зайдите в «Ещё → Экспорт JSON» и сохраните файл, чтобы не потерять данные.'});
  }
  DataStore.state.variableItems.forEach(item=>{
    const st = itemStats(item);
    if(st.overdue) alerts.push({level:'amber', txt:`«${item.name}»: обычно закупаете раз в ~${Math.round(st.avgIntervalDays)} дн., прошло ${st.daysSinceLast} — пора закупить или внести новую покупку.`});
  });
  const monthRange = periodRange('month');
  const cur = expenseByCategory(monthRange), prev = expenseByCategory(prevPeriod(monthRange));
  cur.forEach(c=>{
    const p=prev.find(x=>x.id===c.id);
    if(p && p.amount>500 && c.amount>0){
      const ch=pctChange(c.amount,p.amount);
      if(ch!==null && ch>=25) alerts.push({level:'amber', txt:`Расходы категории «${c.name}» резко выросли (${Math.round(ch)}%).`});
    }
  });
  const goals = DataStore.state.settings.goals;
  if(goals.profit){
    const fc = forecastMonth();
    if(fc && fc.projProfit < goals.profit) alerts.push({level:'red', txt:`Прогноз прибыли (${money(fc.projProfit)}) ниже цели (${money(goals.profit)}).`});
  }
  return alerts;
}

let sheetGen = 0;
function openSheet(html){
  const myGen = ++sheetGen;
  const root=document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" id="ov"><div class="sheet">${html}</div></div>`;
  requestAnimationFrame(()=>{ const ov=document.getElementById('ov'); if(ov) ov.classList.add('open'); });
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeSheet(); });
}
function closeSheet(){
  const myGen = sheetGen;
  const ov=document.getElementById('ov');
  if(!ov) return;
  ov.classList.remove('open');
  setTimeout(()=>{ if(sheetGen===myGen) document.getElementById('modalRoot').innerHTML=''; },180);
}

function fileToBase64(input){
  return new Promise((resolve)=>{
    if(!input || !input.files || !input.files[0]){ resolve(null); return; }
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>resolve(null);
    r.readAsDataURL(input.files[0]);
  });
}

  const s = DataStore.state;

  s.recordedExpenses.forEach(e=>{ if(e.categoryId===id) e.categoryId='misc'; });
  s.variableItems.forEach(i=>{ if(i.categoryId===id) i.categoryId='misc'; });
  s.fixedExpenses.forEach(f=>{ if(f.categoryId===id) f.categoryId='misc'; });

async function saveProduct(editId){
  const s=DataStore.state;
  const name=document.getElementById('f_name').value.trim();
  if(!name){ toast('Укажите название'); return; }
  const photoFile = await fileToBase64(document.getElementById('f_photo'));
  const payload = {
    name, category:document.getElementById('f_category').value||'Прочее',
    costPrice:parseFloat(document.getElementById('f_cost').value)||0,
    salePrice:parseFloat(document.getElementById('f_sale').value)||0,
    quantity:parseFloat(document.getElementById('f_qty').value)||0,
    supplier:document.getElementById('f_supplier').value,
    dateAdded:document.getElementById('f_dateadded').value||todayISO(),
    notes:document.getElementById('f_notes').value
  };
  if(photoFile) payload.photo = photoFile;
  if(editId){
    Object.assign(s.products.find(p=>p.id===editId), payload);
  } else {
    const asExpense = document.querySelector('.chip2[data-asexp].active')?.dataset.asexp==='1';
    const newId = uid();
    s.products.push({id:newId, createdAt:todayISO(), photo:null, ...payload});
    if(asExpense && payload.costPrice>0 && payload.quantity>0){
      s.recordedExpenses.push({id:uid(), createdAt:todayISO(), date:payload.dateAdded, amount:payload.costPrice*payload.quantity,
        categoryId:'warehouse', name:'Закупка товара: '+name, comment:'Автоматически при добавлении товара на склад', source:'auto-warehouse', sourceId:newId});
    }
  }
  DataStore.save(true); closeSheet(); toast('Сохранено'); render();
}
function deleteProduct(id){
  DataStore.state.products = DataStore.state.products.filter(p=>p.id!==id);
  DataStore.state.productSales = DataStore.state.productSales.filter(ps=>ps.productId!==id);
  DataStore.state.recordedExpenses = DataStore.state.recordedExpenses.filter(e=>!(e.source==='auto-warehouse' && e.sourceId===id));
  DataStore.save(true); closeSheet(); toast('Удалено'); UI.stack=[]; render();

function openSellProduct(preId){
  const s=DataStore.state;
  const inStock = s.products.filter(p=>p.quantity>0);
  if(!inStock.length){ toast('Нет товаров в наличии'); return; }
  openSheet(`
    <div class="sheet-handle"></div>
    <h3>Продажа товара со склада</h3>
    <div class="field"><label>Товар</label><select id="f_product" onchange="onProductChange()">${inStock.map(p=>`<option value="${p.id}" ${p.id===preId?'selected':''}>${p.name} (в наличии ${p.quantity})</option>`).join('')}</select></div>

    <div class="field"><label>Цена продажи за шт, ₽</label><input type="number" id="f_price" value="${(s.products.find(p=>p.id===(preId||inStock[0].id))||{}).salePrice||''}"></div>

  `);
}
function onProductChange(){
  const p = DataStore.state.products.find(x=>x.id===document.getElementById('f_product').value);
  if(p) document.getElementById('f_price').value = p.salePrice;
}
function saveProductSale(){
  const s=DataStore.state;
  const productId = document.getElementById('f_product').value;
  const product = s.products.find(p=>p.id===productId);
  let qty = parseFloat(document.getElementById('f_qty').value)||0;
  if(qty<=0){ toast('Укажите количество'); return; }
  if(qty>product.quantity){ toast('Недостаточно товара в наличии'); return; }
  const price = parseFloat(document.getElementById('f_price').value)||product.salePrice;
  const date = document.getElementById('f_date').value||todayISO();
  product.quantity -= qty;
  s.productSales.push({id:uid(), productId, date, quantity:qty, salePrice:price, costPrice:product.costPrice});
  DataStore.save(true); closeSheet(); toast('Продано'); render();
}

function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);

  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },500);
}

function drawBarChart(canvas, series, labels){
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const allVals = series.flatMap(s=>s.data);
  const max = Math.max(1, ...allVals);
  const n = labels.length;
  const padL=6, padR=6, padB=18, padT=10;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const groupW = plotW/n;
  const barW = Math.min(10, groupW/(series.length+1.5));
  labels.forEach((lab,i)=>{
    const gx = padL + i*groupW + groupW/2;
    series.forEach((s,si)=>{
      const val = s.data[i]||0;
      const bh = (val/max)*plotH;
      const bx = gx - (series.length*barW)/2 + si*barW;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      const r=3;
      const y = padT+plotH-bh;
      ctx.moveTo(bx, padT+plotH);
      ctx.lineTo(bx, y+r);
      ctx.quadraticCurveTo(bx,y,bx+r,y);
      ctx.lineTo(bx+barW-r,y);
      ctx.quadraticCurveTo(bx+barW,y,bx+barW,y+r);
      ctx.lineTo(bx+barW, padT+plotH);
      ctx.closePath(); ctx.fill();
    });
    if(n<=12 || i%Math.ceil(n/8)===0){
      ctx.fillStyle='#65656e'; ctx.font='10px Inter'; ctx.textAlign='center';
      ctx.fillText(lab, gx, h-4);
    }
  });
}
function chartSeriesForPeriod(){
  const now=new Date();
  let days;
  if(UI.period==='today'){ days=1; } else if(UI.period==='week'){ days=7; } else if(UI.period==='year'){ days=365; } else { days=30; }
  const step = days>90 ? 30 : (days>30?7:1);
  const labels=[], revenue=[], expenses=[], profit=[];
  for(let i=days-1;i>=0;i-=step){
    const d=new Date(now); d.setDate(now.getDate()-i);
    const iso=d.toISOString().slice(0,10);
    const r = step===1 ? {from:iso,to:iso} : {from:new Date(d-((step-1)*86400000)).toISOString().slice(0,10), to:iso};
    const sum=finSummary(r);
    labels.push(fmtDate(iso).replace(' ',''));
    revenue.push(sum.revenue); expenses.push(sum.totalExpenses); profit.push(sum.profit);
  }
  return {labels,revenue,expenses,profit};
}

      <div class="kpi-mini"><div class="kpi-label">Стоимость склада</div><div class="kpi-value" style="font-size:19px">${money(inventoryValue)}</div></div>
      <div class="kpi-mini"><div class="kpi-label">Позиций</div><div class="kpi-value" style="font-size:19px">${products.length}</div></div>
      <div class="kpi-mini"><div class="kpi-label">Продано за период</div><div class="kpi-value" style="font-size:19px">${money(revenue)}</div></div>
      <div class="kpi-mini"><div class="kpi-label">Прибыль от товаров</div><div class="kpi-value" style="font-size:19px;color:${profit>=0?'var(--emerald-bright)':'var(--red)'}">${money(profit)}</div></div>
    </div>
    <div class="btn-row" style="margin-top:12px"><button class="btn btn-primary" onclick="openAddProduct()">+ Товар</button><button class="btn btn-ghost" onclick="openSellProduct()">Продать товар</button></div>
    <div class="h2">Товары на складе</div>
    ${products.length? products.map(p=>{
      const margin = p.salePrice>0 ? Math.round((p.salePrice-p.costPrice)/p.salePrice*100) : 0;
      return `<div class="card tight" onclick="push('productDetail',{id:'${p.id}'})">
        <div class="listitem" style="border:none; padding:2px 0;">
          <div class="avatar">${p.photo?`<img src="${p.photo}">`:'🛍'}</div>
          <div class="main"><div class="title">${p.name}</div><div class="sub">Добавлен ${fmtDate(p.dateAdded)} · в наличии ${p.quantity}</div></div>
          ${p.quantity<=0?`<span class="badge r">Нет в наличии</span>`:`<span class="badge g">${margin}% маржа</span>`}
        </div>
      </div>`;
    }).join('') : `<div class="empty"><div class="big">🏬</div>Добавьте первый товар на склад</div>`}
  `;
}
function screenProductDetail(id){
  const s=DataStore.state;
  const p = s.products.find(x=>x.id===id);
  const sales = s.productSales.filter(ps=>ps.productId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const totalSold = sales.reduce((a,x)=>a+x.quantity,0);
  const totalRevenue = sales.reduce((a,x)=>a+x.quantity*x.salePrice,0);
  const totalProfit = sales.reduce((a,x)=>a+x.quantity*(x.salePrice-x.costPrice),0);
  const lastSaleDate = sales[0]?.date || null;
  const margin = p.salePrice>0 ? Math.round((p.salePrice-p.costPrice)/p.salePrice*100) : 0;
  return `
    <div class="card">
      <div class="row"><div class="avatar" style="width:64px;height:64px;border-radius:16px;">${p.photo?`<img src="${p.photo}">`:'🛍'}</div>
        <div style="flex:1; margin-left:12px;"><div class="kpi-label">${p.category}</div><div style="font-weight:700; font-size:17px">${p.name}</div></div>
      </div>
    </div>
    <div class="kpi-grid">
      <div class="kpi-mini"><div class="kpi-label">В наличии</div><div class="kpi-value" style="font-size:19px">${p.quantity} шт</div></div>
      <div class="kpi-mini"><div class="kpi-label">Маржа</div><div class="kpi-value" style="font-size:19px">${margin}%</div></div>
      <div class="kpi-mini"><div class="kpi-label">Себестоимость</div><div class="kpi-value" style="font-size:19px">${money(p.costPrice)}</div></div>
      <div class="kpi-mini"><div class="kpi-label">Цена продажи</div><div class="kpi-value" style="font-size:19px">${money(p.salePrice)}</div></div>
      <div class="kpi-mini"><div class="kpi-label">Дата добавления</div><div class="kpi-value" style="font-size:17px">${fmtDate(p.dateAdded)}</div></div>
      <div class="kpi-mini"><div class="kpi-label">Дата последней продажи</div><div class="kpi-value" style="font-size:17px">${lastSaleDate?fmtDate(lastSaleDate):'Ещё не продавался'}</div></div>
    </div>
    <div class="h2">Итого продано</div>
    <div class="card">
      <div class="row"><span class="subtext">Продано, шт</span><span style="font-weight:700">${totalSold}</span></div>
      <div class="row" style="margin-top:8px"><span class="subtext">Выручка</span><span style="font-weight:700">${money(totalRevenue)}</span></div>
      <div class="row" style="margin-top:8px"><span class="subtext">Прибыль</span><span style="font-weight:700; color:${totalProfit>=0?'var(--emerald-bright)':'var(--red)'}">${money(totalProfit)}</span></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="openAddProduct('${id}')">Изменить</button>
      <button class="btn btn-ghost" onclick="openSellProduct('${id}')" ${p.quantity<=0?'disabled':''}>Продать</button>
    </div>
    <div class="h2">Поставщик и заметки</div>
    <div class="card">
      <div class="row"><span class="subtext">Поставщик</span><span style="font-weight:700">${p.supplier||'—'}</span></div>
      ${p.notes?`<div class="subtext" style="margin-top:8px">${p.notes}</div>`:''}
    </div>
    <div class="h2">История продаж (даты)</div>
    <div class="card">${sales.length? sales.map(x=>`<div class="linkrow"><span class="t">${fmtDate(x.date)} · ${x.quantity} шт</span><span>${money(x.quantity*x.salePrice)}</span></div>`).join('') : `<div class="empty">Продаж ещё не было</div>`}</div>
  `;
}

function screenMore(){
  return `
    <div class="h2">Бизнес</div>
    <div class="card">
      <div class="linkrow" onclick="push('fines',{})"><span class="t">🚫 Штрафы</span><span class="arrow">›</span></div>
      <div class="linkrow" onclick="push('history',{})"><span class="t">🧾 История операций</span><span class="arrow">›</span></div>
      <div class="linkrow" onclick="push('analytics',{})"><span class="t">📊 Аналитика</span><span class="arrow">›</span></div>
    </div>
    <div class="h2">Настройки</div>
    <div class="card">
      <div class="linkrow" onclick="openSetGoals()"><span class="t">🎯 Цели</span><span class="arrow">›</span></div>
      <div class="linkrow" onclick="openSalarySettings()"><span class="t">💼 Процент барберам (сейчас ${DataStore.state.settings.salaryPercent}%)</span><span class="arrow">›</span></div>
      <div class="linkrow" onclick="openPinSetup()"><span class="t">🔒 PIN-код</span><span class="arrow">›</span></div>
      <div class="linkrow" onclick="exportJSON()"><span class="t">⬇️ Экспорт JSON</span><span class="arrow">›</span></div>
      <div class="linkrow" onclick="exportCSV()"><span class="t">⬇️ Экспорт CSV</span><span class="arrow">›</span></div>
      ${DataStore.state.settings.isDemo?`<div class="linkrow" onclick="clearDemoData()"><span class="t" style="color:var(--red)">🗑 Очистить демо-данные</span><span class="arrow">›</span></div>`:''}
    </div>
    <div class="subtext" style="text-align:center; margin-top:20px;">JOKER · v3.0<br>Данные хранятся локально на устройстве владельца.</div>
  `;
}
function screenFines(){
  const fines = [...DataStore.state.fines].sort((a,b)=>b.date.localeCompare(a.date));
  const total = sumAmount(fines);
  return `
    <div class="card"><div class="kpi-label">Всего штрафов</div><div class="kpi-value" style="font-size:24px">${money(total)}</div></div>
    <div class="btn-row"><button class="btn btn-primary" onclick="openAddFine()">+ Штраф</button></div>
    <div class="h2">Список</div>
    <div class="card">${fines.length? fines.map(f=>`
      <div class="listitem" onclick="openAddFine('${f.id}')">
        <div class="avatar">🚫</div>
        <div class="main"><div class="title">${f.comment||'Штраф'}</div><div class="sub">${fmtDate(f.date)}</div></div>
        <div class="amt pos">+${money(f.amount)}</div>
      </div>`).join('') : `<div class="empty">Штрафов ещё не было</div>`}</div>
  `;
}
function screenHistory(){
  const s = DataStore.state;
  const rev = s.dailyRevenue.map(r=>({...r,_type:'rev'}));
  const fines = s.fines.map(f=>({...f,_type:'fine'}));
  const recorded = s.recordedExpenses.map(e=>({...e,_type:'exp'}));
  const purchases = s.variablePurchases.map(p=>({...p,_type:'purchase'}));
  const psales = s.productSales.map(ps=>({...ps,_type:'psale'}));
  const all = [...rev,...fines,...recorded,...purchases,...psales].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,150);
  return `
    <div class="card">
      ${all.length? all.map(x=>{
        if(x._type==='rev') return `<div class="listitem" onclick="openEditRevenue('${x.id}')"><div class="avatar">💰</div><div class="main"><div class="title">Выручка</div><div class="sub">${fmtDate(x.date)}</div></div><div class="amt pos">+${money(x.amount)}</div></div>`;
        if(x._type==='fine') return `<div class="listitem" onclick="openAddFine('${x.id}')"><div class="avatar">🚫</div><div class="main"><div class="title">${x.comment||'Штраф'}</div><div class="sub">${fmtDate(x.date)}</div></div><div class="amt pos">+${money(x.amount)}</div></div>`;
        if(x._type==='exp') return `<div class="listitem" onclick="${x.source==='manual'?`openAddOneOff('${x.id}')`:`openRecordedExpenseDetail('${x.id}')`}"><div class="avatar">🧾</div><div class="main"><div class="title">${x.name||'Расход'}</div><div class="sub">${fmtDate(x.date)}</div></div><div class="amt neg">-${money(x.amount)}</div></div>`;
        if(x._type==='purchase'){ const item=s.variableItems.find(i=>i.id===x.itemId); return `<div class="listitem" onclick="openEditVariablePurchase('${x.id}')"><div class="avatar">☕️</div><div class="main"><div class="title">${item?item.name:'Закупка'}</div><div class="sub">${fmtDate(x.date)}</div></div><div class="amt neg">-${money(x.amount)}</div></div>`; }
        const p = s.products.find(pp=>pp.id===x.productId);
        return `<div class="listitem"><div class="avatar">🛍</div><div class="main"><div class="title">Продано: ${p?p.name:'—'}</div><div class="sub">${fmtDate(x.date)} · ${x.quantity} шт</div></div><div class="amt pos">+${money(x.quantity*x.salePrice)}</div></div>`;
      }).join('') : `<div class="empty"><div class="big">🧾</div>Операций ещё нет</div>`}
    </div>
  `;
}
function screenAnalytics(){
  const range = periodRange(UI.period, UI.customRange);
  const cur = finSummary(range);
  const cats = expenseByCategory(range);
  const fc = forecastMonth();
  const be = breakEvenToday();
  return `
    <div class="h2">Финансы</div>
    <div class="card">
      <div class="row"><span class="subtext">Выручка</span><span style="font-weight:700">${money(cur.revenue)}</span></div>
      <div class="row" style="margin-top:8px"><span class="subtext">Штрафы</span><span style="font-weight:700">${money(cur.fines)}</span></div>
      <div class="row" style="margin-top:8px"><span class="subtext">Продажи склада</span><span style="font-weight:700">${money(cur.productRevenue)}</span></div>
      <div class="row" style="margin-top:8px"><span class="subtext">Итого доход</span><span style="font-weight:700">${money(cur.totalIncome)}</span></div>
      <div class="row" style="margin-top:8px"><span class="subtext">Расходы (всего)</span><span style="font-weight:700">${money(cur.totalExpenses)}</span></div>
      <div class="row" style="margin-top:8px"><span class="subtext">Прибыль</span><span style="font-weight:700">${money(cur.profit)}</span></div>
      <div class="row" style="margin-top:8px"><span class="subtext">Маржа</span><span style="font-weight:700">${Math.round(cur.margin)}%</span></div>
    </div>
    <div class="h2">Ежедневная стоимость бизнеса</div>
    <div class="card">
      <div class="row"><span class="subtext">Постоянные / день</span><span style="font-weight:700">${money(be.fixed)}</span></div>
      <div class="row" style="margin-top:8px"><span class="subtext">Переменные / день</span><span style="font-weight:700">${money(be.variable)}</span></div>
      <div class="row" style="margin-top:8px"><span class="subtext">Итого / день</span><span style="font-weight:700">${money(be.daily)}</span></div>
      <div class="row" style="margin-top:8px"><span class="subtext">Нужная выручка в день (безубыточность)</span><span style="font-weight:700">${be.requiredRevenue?money(be.requiredRevenue):'—'}</span></div>
    </div>
    <div class="h2">Прогноз на месяц</div>
    <div class="card">${fc? `
      <div class="subtext">Прогноз — оценка, не гарантированный результат.</div>
      <div class="row" style="margin-top:10px"><span class="subtext">Доход</span><span style="font-weight:700">${money(fc.projIncome)}</span></div>
      <div class="row" style="margin-top:8px"><span class="subtext">Расходы</span><span style="font-weight:700">${money(fc.projExpenses)}</span></div>
      <div class="row" style="margin-top:8px"><span class="subtext">Прибыль</span><span style="font-weight:700">${money(fc.projProfit)}</span></div>
    ` : `<div class="empty">Недостаточно данных для прогноза</div>`}</div>
    <div class="h2">Категории расходов — доля от дохода</div>
    <div class="card">${cats.filter(c=>c.amount>0).map(c=>`<div class="row" style="padding:6px 0"><span class="subtext">${c.name}</span><span>${cur.totalIncome>0?Math.round(c.amount/cur.totalIncome*100):0}%</span></div>`).join('') || `<div class="empty">Нет расходов</div>`}</div>
  `;
}

const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/></svg>',
  expenses:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20V10M9 20V4M15 20v-7M21 20V8"/></svg>',
  warehouse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10 12 4l8 6v9H4z"/><path d="M9 19v-6h6v6"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>'
};

function currentScreenHtml(){
  if(UI.stack.length){
    const top = UI.stack[UI.stack.length-1];
    let inner='', title='';
    switch(top.name){
      case 'categoryDetail': inner=screenCategoryDetail(top.params.catId); title=DataStore.state.categories.find(c=>c.id===top.params.catId)?.name||'Категория'; break;
      case 'variableItemDetail': inner=screenVariableItemDetail(top.params.id); title='Расходник'; break;
      case 'productDetail': inner=screenProductDetail(top.params.id); title='Товар'; break;
      case 'fines': inner=screenFines(); title='Штрафы'; break;
      case 'history': inner=screenHistory(); title='История операций'; break;
      case 'analytics': inner=screenAnalytics(); title='Аналитика'; break;
    }
    return `<div class="topbar"><div class="brandrow"><div class="iconbtn" onclick="pop()">←</div><div class="brand">${title}</div><div style="width:38px"></div></div></div><div class="screen">${inner}</div>`;
  }
  let inner='', showPeriod=true;
  switch(UI.tab){
    case 'home': inner=screenHome(); break;
    case 'expenses': inner=screenExpenses(); break;
    case 'warehouse': inner=screenWarehouse(); showPeriod=false; break;
    case 'more': inner=screenMore(); showPeriod=false; break;
  }
  return `
    <div class="topbar">
      <div class="brandrow"><div class="brand"><span class="dot"></span>JOKER</div><div class="iconbtn" onclick="push('history',{})">🕘</div></div>
      ${showPeriod?renderPeriodChips():''}
    </div>
    <div class="screen">${inner}</div>
  `;
}
function renderNav(){
  const tabs=[['home','Главная'],['expenses','Расходы'],['warehouse','Склад'],['more','Ещё']];
  return `<div class="navbar">${tabs.map(([k,l])=>`
    <div class="navitem ${UI.tab===k && !UI.stack.length?'active':''}" onclick="goTab('${k}')">${ICONS[k]}<span>${l}</span></div>
  `).join('')}</div>
  <button class="fab" onclick="openQuickAdd()">+</button>`;
}
function renderLock(){
  window._pinBuf = window._pinBuf || '';
  const dots = [0,1,2,3].map(i=>`<div class="pindot ${i<window._pinBuf.length?'filled':''}"></div>`).join('');
  document.getElementById('app').innerHTML = `
    <div class="lockwrap">
      <div class="brand" style="font-size:24px; margin-bottom:6px;"><span class="dot"></span>JOKER</div>
      <div class="subtext">Введите PIN владельца</div>
      <div class="pindots">${dots}</div>
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="key" onclick="pinPress('${n}')">${n}</div>`).join('')}
        <div class="key ghost"></div>
        <div class="key" onclick="pinPress('0')">0</div>
        <div class="key ghost" onclick="pinPress('back')">⌫</div>
      </div>
    </div>`;
}
function pinPress(v){
  if(v==='back'){ window._pinBuf = window._pinBuf.slice(0,-1); renderLock(); return; }
  if(window._pinBuf.length>=4) return;
  window._pinBuf += v;
  if(window._pinBuf.length===4){
    if(window._pinBuf===DataStore.state.settings.pin){ window._unlocked=true; window._pinBuf=''; render(); }
    else { toast('Неверный PIN'); setTimeout(()=>{ window._pinBuf=''; renderLock(); },350); }
  }
  renderLock();
}
function render(){
  if(DataStore.state.settings.pin && !window._unlocked){ renderLock(); return; }
  document.getElementById('app').innerHTML = currentScreenHtml() + renderNav();
  const chartEl = document.getElementById('homeChart');
  if(chartEl){
    const data = chartSeriesForPeriod();
    const map = {revenue:{color:'#1ea377',data:data.revenue},expenses:{color:'#e5584f',data:data.expenses},profit:{color:'#7a6bd6',data:data.profit}};
    const s = map[UI.homeChart];
    drawBarChart(chartEl, [{data:s.data, color:s.color}], data.labels);
  }
}

/* =============================== BOOT =============================== */
(async function boot(){
  document.getElementById('app').innerHTML = `<div class="lockwrap"><div class="brand" style="font-size:22px"><span class="dot"></span>JOKER</div><div class="subtext" style="margin-top:10px">Загрузка…</div></div>`;
  if('serviceWorker' in navigator){
    try{
      const reg = await navigator.serviceWorker.register('./sw.js?v=3');
      reg.update();
    }catch(e){ /* offline shell unavailable, app still works */ }
  }
  await DataStore.load();
  render();
})();
</script>
</body>
</html>
